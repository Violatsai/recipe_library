name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # server/src/config.ts requires DATABASE_URL to be present (non-empty)
      # at import time, even though the unit tests here don't touch a real
      # database — a placeholder is enough, no Postgres service needed.
      - run: npm test
        env:
          DATABASE_URL: postgres://localhost:5432/ci_placeholder
