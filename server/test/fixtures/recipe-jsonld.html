<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Miso-Glazed Eggplant</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      { "@type": "WebSite", "name": "Test Kitchen" },
      { "@type": "Person", "name": "A. Cook" },
      {
        "@type": "Recipe",
        "name": "Miso-Glazed Eggplant",
        "recipeYield": "2 servings",
        "totalTime": "PT30M",
        "recipeIngredient": [
          "2 Japanese eggplants, halved",
          "3 tbsp white miso",
          "1 tbsp mirin",
          "1 tsp sesame oil",
          "1 scallion, sliced"
        ],
        "recipeInstructions": [
          { "@type": "HowToStep", "text": "Score the eggplant flesh in a crosshatch." },
          { "@type": "HowToStep", "text": "Whisk miso, mirin, and sesame oil into a glaze." },
          { "@type": "HowToStep", "text": "Broil eggplant, brush with glaze, broil again until caramelized." },
          { "@type": "HowToStep", "text": "Top with scallion and serve." }
        ]
      }
    ]
  }
  </script>
</head>
<body>
  <article>
    <h1>Miso-Glazed Eggplant</h1>
    <p>A quick weeknight side with a savory-sweet miso glaze.</p>
  </article>
</body>
</html>
